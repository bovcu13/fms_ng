<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GPS車隊管理平台 - 天網熊貓 - SkyNet Panda</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts & Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- 引入 Google Fonts 中的 Material Icons 圖標字體，可用於添加各種圖標和符號。 -->

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- 引入 Font Awesome 圖標字體，提供了豐富的圖標集合。 -->

  <!-- PrimeFlex -->
  <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css">
  <!-- 引入 PrimeFlex CSS 框架，用於支持 PrimeNG 的布局和樣式。 -->

  <!-- Google Maps JavaScript API with Places and Directions libraries -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAffqR5DnIOBq1Vqw9lm-_mhwNVV8j6uU4&libraries=places,directions"></script>
  <!-- 引入 Google Maps JavaScript API，同時包含了 Places 和 Directions 库，用於地圖和路徑方向的顯示。 -->

  <!-- Google Maps JavaScript API with Drawing library -->
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAffqR5DnIOBq1Vqw9lm-_mhwNVV8j6uU4&libraries=drawing&callback=initMap"></script>
  <!-- 引入 Google Maps JavaScript API，同時包含了 Drawing 库，用於在地圖上添加繪圖圖層。 -->

  <!-- flv.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flv.js/1.4.2/flv.min.js"></script>
  <!-- 引入 flv.js，一個用於處理 FLV 格式視頻的 JavaScript 庫。 -->

  <!-- Chart.js with Zoom Plugin -->
  <script src="path/to/chartjs/dist/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8hammerjs@2.0.8"></script>
  <script src="path/to/chartjs-plugin-zoom/dist/chartjs-plugin-zoom.min.js"></script>
  <!-- 引入 Chart.js 圖表庫，同時包含了 Zoom Plugin，用於創建和顯示交互式圖表。 -->

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100;200;400;700;800&display=swap" rel="stylesheet">
  <!-- 引入 Oswald 和 Noto Sans TC，用於自定義網站的字體風格。 -->

</head>
<body>
<app-root></app-root>
</body>
</html>
