<div class="overflow-x-hidden flex justify-content-center">
  <div class="col-8">
    <p-tabView>
      <p-tabPanel header="派工與調度">
        <p-card header="派工與調度">
          <p-tabView>
            <p-tabPanel header="所有工作">
              <div class="flex justify-content-end mb-3">
                <p-button (click)="showListBtn()" icon="pi pi-list"
                          styleClass="p-button-info p-button-text mr-2"></p-button>
                <p-button (click)="closeListBtn()" icon="pi pi-calendar"
                          styleClass="p-button-info p-button-text mr-5"></p-button>
                <p-button icon="pi pi-plus" (click)="showAddEventDialog('add')"
                          styleClass="p-button-info p-button-text"></p-button>
              </div>
              <ng-container *ngIf="showList == true">
                <p-dataView [value]="dispatchEvents">
                  <ng-template let-product pTemplate="listItem">
                    <div pRipple class="col-6 styled-box" (click)="showAddEventDialog('editList',product)">
                      <div class="flex flex-column align-items-center xl:flex-row xl:align-items-start p-3 gap-4">
                        <img class="w-8 sm:w-5rem xl:w-3rem" [src]="'assets/image/warehouse.png'"/>
                        <div
                          class="flex sm:flex-row justify-content-between align-items-center xl:align-items-start flex-1 gap-4">
                          <div class="flex flex-column align-items-center xl:align-items-start gap-3">
                            <div class="font-bold xl:text-lg font-bold">{{ product.title }}</div>
                            <div class="flex align-items-center gap-3">
                                <span class="flex align-items-center gap-2">
                                <i class="pi pi-at text-xs"></i>
                                <span class="font-medium text-xs">{{ product.driver }}</span>
                                  </span>
                              <span class="flex align-items-center gap-2">
                                <i class="pi pi-tag text-xs"></i>
                                <span class="font-medium text-xs">{{ product.form }}</span>
                                </span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </ng-template>
                </p-dataView>
              </ng-container>
              <ng-container *ngIf="showList == false">
                <div class="flex justify-content-center">
                  <div class="col-12">
                    <full-calendar
                      [options]="calendarOptions"
                    ></full-calendar>
                  </div>
                </div>
              </ng-container>
            </p-tabPanel>
          </p-tabView>
        </p-card>
      </p-tabPanel>
    </p-tabView>
  </div>
</div>

<form [formGroup]="event_form">
  <p-dialog header="{{dialogHeader}}" [(visible)]="addEventVisible" [modal]="true" [style]="{ width: '40vw' }"
            [draggable]="false" [resizable]="false">
    <div class="grid">
      <div class="field col-12 md:col-6 lg:col-6">
        <label class="font-semibold">名稱</label>
        <input formControlName="name" pInputText/>
      </div>
      <div class="field col-12 md:col-6 lg:col-6">
        <label class="font-semibold">運輸訂單</label>
        <p-dropdown placeholder="選擇訂單" [options]="formList"></p-dropdown>
      </div>
      <div class="field col-12 md:col-12 lg:col-12">
        <label class="font-semibold">開始日期</label>
        <p-calendar formControlName="start_date" [appendTo]="'body'"></p-calendar>
      </div>
      <div class="field col-12 md:col-6 lg:col-6">
        <label class="font-semibold">預計結束日期</label>
        <p-calendar formControlName="end_date" [appendTo]="'body'"></p-calendar>
      </div>
      <div *ngIf="dialogHeader == '編輯任務'" class="field col-12 md:col-6 lg:col-6">
        <label class="font-semibold">實際結束日期</label>
        <p-calendar [appendTo]="'body'"></p-calendar>
      </div>
      <div class="field col-12 md:col-6 lg:col-6">
        <label class="font-semibold">司機</label>
        <p-dropdown placeholder="選擇司機" [options]="driverData" optionLabel="name"></p-dropdown>
      </div>
      <div class="field col-12 md:col-6 lg:col-6">
        <label class="font-semibold">車牌</label>
        <input pInputText [disabled]="true"/>
      </div>
      <div class="field col-12 md:col-6 lg:col-6">
        <label class="font-semibold">預計出車時間</label>
        <p-calendar [showTime]="true" [showSeconds]="true" [appendTo]="'body'"></p-calendar>
      </div>
      <div *ngIf="dialogHeader == '編輯任務'" class="field col-12 md:col-6 lg:col-6">
        <label class="font-semibold">實際出車時間</label>
        <input pInputText />
      </div>
      <div class="field col-12 md:col-6 lg:col-6">
        <label class="font-semibold">預計到達時間</label>
        <p-calendar [showTime]="true" [showSeconds]="true" [appendTo]="'body'"></p-calendar>
      </div>
      <div *ngIf="dialogHeader == '編輯任務'" class="field col-12 md:col-6 lg:col-6">
        <label class="font-semibold">實際到達時間</label>
        <p-calendar [showTime]="true" [showSeconds]="true" [appendTo]="'body'"></p-calendar>
      </div>
    </div>
    <div class="flex justify-content-end">
      <p-button label="新增" styleClass="p-button-primary mr-2"></p-button>
      <p-button label="取消" styleClass="p-button-outlined p-button-secondary"></p-button>
    </div>
  </p-dialog>
</form>
