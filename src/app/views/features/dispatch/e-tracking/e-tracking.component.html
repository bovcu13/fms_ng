<div class="overflow-x-hidden flex justify-content-center">
  <div class="col-8">
    <p-tabView>
      <p-tabPanel header="貨態追蹤">
        <p-card header="貨態追蹤">
          <div class="col-12 flex justify-content-between mb-3">
            <div class="w-full">
                <span class="w-full p-input-icon-left">
                <i class="pi pi-search text-yellow-600"></i>
                <input type="text" pInputText />
                </span>
            </div>
            <div class="ml-2">
              <p-button icon="pi pi-sliders-h" severity="secondary"></p-button>
            </div>
          </div>
          <p-tabView>
            <p-tabPanel header="所有訂單">
              <p-table [value]="list"
                       [(selection)]="selectedTrack"
                       (selectionChange)="handleCheckbox($event)"
                       [paginator]="true"
                       [rows]="5"
                       [showCurrentPageReport]="true"
                       [rowsPerPageOptions]="[5, 10, 20]"
                       dataKey="id"
                       styleClass="p-datatable-sm">
                <ng-template pTemplate="header">
                  <tr>
                    <th style="width: 1rem">
                      <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                    </th>
                    <th class="pl-4">訂單資訊</th>
                    <th></th>
                    <th class="text-center">起卸點</th>
                    <th></th>
                    <th class="text-center">派工調度</th>
                  </tr>
                </ng-template>
                <ng-template pTemplate="body" let-list>
                  <tr class="styled-box">
                    <td>
                      <p-tableCheckbox [value]="list"></p-tableCheckbox>
                    </td>
                    <td (click)="goToForm(list.id)">
                      <div class="flex align-items-center p-3 gap-4">
                        <div
                          class="flex sm:flex-row justify-content-between align-items-center xl:align-items-start flex-1 gap-4">
                          <div class="flex flex-column align-items-center xl:align-items-start gap-3">
                            <div class="font-bold">{{ list.name }}</div>
                            <div class="flex align-items-center gap-3">
                              <span class="flex align-items-center gap-2">
                                <i class="pi pi-tag text-xs"></i>
                                <span class="font-medium text-xs">{{ list.code }}</span>
                                </span>
                              <p-tag styleClass="text-xs" [severity]="getStatus('運輸中')" value="運輸中"></p-tag>
                            </div>
                          </div>
                        </div>
                      </div>
                    </td>
                    <td class="text-sm text-center" (click)="goToForm(list.id)">{{list.origin}}</td>
                    <td class="text-center" (click)="goToForm(list.id)">→</td>
                    <td class="text-sm text-center" (click)="goToForm(list.id)">{{list.destination}}</td>
                    <td class="text-sm text-center">
                      <p-tag [severity]="getDispatch(list.binding)" value="{{ list.binding }}"></p-tag>
                    </td>
                  </tr>
                </ng-template>
              </p-table>
            </p-tabPanel>
          </p-tabView>
        </p-card>
      </p-tabPanel>
    </p-tabView>
  </div>
</div>
