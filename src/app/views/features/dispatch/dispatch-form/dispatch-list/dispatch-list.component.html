    <p-card header="託運訂單">
      <div class="flex justify-content-end">
        <p-button label="API串接說明" [raised]="true" severity="success"></p-button>
      </div>
      <p-tabView>
        <p-tabPanel header="所有訂單">
          <!--          <div class="flex justify-content-end mb-3">-->

          <!--          </div>-->
          <div class="card">
            <p-table [value]="list" [(selection)]="selectedForm" (selectionChange)="handleCheckbox($event)"
                     dataKey="id"
                     styleClass="p-datatable-sm">
              <ng-template pTemplate="header">
                <tr>
                  <th style="width: 1rem">
                    <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                  </th>
                  <th></th>
                  <th>
                    <div class="flex justify-content-end">
                      <p-button routerLink="/dispatch_form" icon="pi pi-plus" [text]="true" size="small"></p-button>
                    </div>
                  </th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-list>
                <tr>
                  <td>
                    <p-tableCheckbox [value]="list"></p-tableCheckbox>
                  </td>
                  <td>
                    <div class="flex align-items-center p-3 gap-4">
                      <div
                        class="flex sm:flex-row justify-content-between align-items-center xl:align-items-start flex-1 gap-4">
                        <div class="flex flex-column align-items-center xl:align-items-start gap-3">
                          <div class="text-lg font-bold">{{ list.name }}</div>
                          <div class="flex align-items-center gap-3">
                                <span class="flex align-items-center gap-2">
                                <i class="pi pi-calendar text-xs"></i>
                                <span class="font-medium text-xs">{{ list.created_at }}</span>
                                  </span>
                            <span class="flex align-items-center gap-2">
                                <i class="pi pi-tag text-xs"></i>
                                <span class="font-medium text-xs">{{ list.id }}</span>
                                </span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </td>
                  <td>
                    <div class="flex justify-content-end">
                      <p-button (click)="goToForm(list.id)" icon="fas fa-pencil-alt" size="small"></p-button>
                    </div>
                  </td>
                </tr>
              </ng-template>
            </p-table>
          </div>
