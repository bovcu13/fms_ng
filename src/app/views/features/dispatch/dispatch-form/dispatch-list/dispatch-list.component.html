<div class="overflow-x-hidden flex justify-content-center">
  <div class="col-8">
    <!--    <p-tabView>-->
    <!--      <p-tabPanel header="派工單">-->
    <p-card header="託運訂單">
      <div class="flex justify-content-end">
        <p-button label="API串接說明" [raised]="true" severity="success"></p-button>
      </div>
      <p-tabView>
        <p-tabPanel header="所有訂單">
          <div class="flex justify-content-end mb-3">
            <p-button *ngIf="selectedForm.length > 0" icon="pi pi-times-circle" [text]="true"
                      severity="danger " size="small" pTooltip="作廢"></p-button>
            <p-button routerLink="/dispatch_form" icon="pi pi-plus"
                      [text]="true" size="small" pTooltip="新增"></p-button>
          </div>
            <p-table [value]="list"
                     [(selection)]="selectedForm"
                     (selectionChange)="handleCheckbox($event)"
                     [paginator]="true"
                     [rows]="5"
                     [showCurrentPageReport]="true"
                     [rowsPerPageOptions]="[5, 10, 20]"
                     dataKey="id"
                     styleClass="p-datatable-sm">
              <ng-template pTemplate="header">
                <tr>
                  <th style="width: 1rem">
                    <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                  </th>
                  <th class="pl-4">訂單資訊</th>
                  <th>託運人</th>
                  <th></th>
                  <th class="text-center">起卸點</th>
                  <th></th>
                  <th class="text-center">派工調度</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-list>
                <tr class="styled-box">
                  <td>
                    <p-tableCheckbox [value]="list"></p-tableCheckbox>
                  </td>
                  <td pRipple (click)="goToForm(list.id)">
                    <div class="flex align-items-center p-3 gap-4">
                      <div
                        class="flex sm:flex-row justify-content-between align-items-center xl:align-items-start flex-1 gap-4">
                        <div class="flex flex-column align-items-center xl:align-items-start gap-3">
                          <div class="font-bold">{{ list.name }}</div>
                          <div class="flex align-items-center gap-3">
                                <span class="flex align-items-center gap-2">
                                <i class="pi pi-calendar text-xs"></i>
                                <span class="font-medium text-xs">{{ list.created_at }}</span>
                                  </span>
                            <span class="flex align-items-center gap-2">
                                <i class="pi pi-tag text-xs"></i>
                                <span class="font-medium text-xs">{{ list.id }}</span>
                                </span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </td>
                  <td pRipple (click)="goToForm(list.id)" class="text-sm">
                    <img src="assets/image/car2.png" width="32" style="vertical-align: middle"/>
                    <span class="ml-2 vertical-align-middle">{{ list.client }}</span>
                  </td>
                  <td class="text-sm text-center"
                      pRipple (click)="goToForm(list.id)">{{list.origin}}</td>
                  <td class="text-center"
                      pRipple (click)="goToForm(list.id)">→</td>
                  <td class="text-sm text-center"
                      pRipple (click)="goToForm(list.id)">{{list.destination}}</td>
                  <td class="text-sm text-center">
                    <p-tag [severity]="getSeverity(list.binding)" value="{{ list.binding }}"></p-tag>
                  </td>
                </tr>
              </ng-template>
            </p-table>
