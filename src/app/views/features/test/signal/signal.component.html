<p-button label="查詢" (click)="search()"></p-button>
<p-table [value]="transformedData">
  <ng-template pTemplate="header">
    <tr>
      <th>定位時間</th>
      <th>定位位置</th>
      <th>地標名稱</th>
      <th>狀態</th>
      <th>時速(Km/h)</th>
      <th>公里數</th>
      <th>溫度1</th>
      <th>方向</th>
      <th>經度</th>
      <th>緯度</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-product>
    <tr>
      <td>{{ product.date_time | date:'yyyy-MM-dd HH:mm:ss' }}</td>
      <td>{{ product.addr }}</td>
      <td> -</td>
      <td> -</td>
      <td>{{ product.speed }}</td>
      <td> -</td>
      <td> -</td>
      <td>{{ product.direction }}</td>
      <td>{{ product.lat }}</td>
      <td>{{ product.lng }}</td>
    </tr>
  </ng-template>
</p-table>
