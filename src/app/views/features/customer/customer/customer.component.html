<div class="overflow-x-hidden flex justify-content-center">
  <div class="col-8">
    <p-tabView>
      <p-tabPanel header="公司">
        <p-card header="公司">
          <p-tabView>
            <p-tabPanel header="所有公司">
              <div class="flex justify-content-end mb-3">
                <p-button label="新增" (click)="openAddCompany()"
                          styleClass="p-button-link p-button-sm"></p-button>
              </div>
            </p-tabPanel>
            <p-tabPanel header="功能 II">

            </p-tabPanel>
            <p-tabPanel header="功能 III">

            </p-tabPanel>
          </p-tabView>

        </p-card>
      </p-tabPanel>
      <p-tabPanel header="聯絡人">
        <p-card header="聯絡人">
          <p-tabView>
            <p-tabPanel header="所有聯絡人">
              <div class="flex justify-content-end mb-3">
                <p-button label="新增" (click)="openAddCustomer()"
                          styleClass="p-button-link p-button-sm"></p-button>
              </div>
            </p-tabPanel>
            <p-tabPanel header="功能 II">

            </p-tabPanel>
            <p-tabPanel header="功能 III">

            </p-tabPanel>
          </p-tabView>

        </p-card>
      </p-tabPanel>
      <p-tabPanel header="功能 III">

      </p-tabPanel>
    </p-tabView>
  </div>
</div>

<p-dialog header="新增公司" [(visible)]="addCompanyVisible" [modal]="true" [style]="{ width: '40vw' }" [draggable]="false" [resizable]="false">
  <div class="grid">
    <div class="field col-12 md:col-6 lg:col-6">
      <label class="font-semibold">公司名稱</label>
      <input pInputText />
    </div>
    <div class="field col-12 md:col-6 lg:col-6">
      <label class="font-semibold">公司類別</label>
      <p-dropdown></p-dropdown>
    </div>
    <div class="field col-12 md:col-6 lg:col-6">
      <label class="font-semibold">電話</label>
      <input pInputText />
    </div>
    <div class="field col-12 md:col-6 lg:col-6">
      <label class="font-semibold">行業</label>
      <input pInputText />
    </div>
  </div>
  <div class="flex justify-content-end">
    <p-button label="新增" styleClass="p-button-primary mr-2"></p-button>
    <p-button label="取消" styleClass="p-button-outlined p-button-secondary"></p-button>
  </div>
</p-dialog>

<p-dialog header="新增聯絡人" [(visible)]="addCustomerVisible" [modal]="true" [style]="{ width: '40vw' }" [draggable]="false" [resizable]="false">
  <div class="grid">
    <div class="field col-12 md:col-6 lg:col-6">
      <label class="font-semibold">公司</label>
      <p-dropdown></p-dropdown>
    </div>
    <div class="field col-12 md:col-6 lg:col-6">
      <label class="font-semibold">姓名</label>
      <input pInputText />
    </div>
    <div class="field col-12 md:col-6 lg:col-6">
      <label class="font-semibold">稱謂</label>
      <p-dropdown></p-dropdown>
    </div>
    <div class="field col-12 md:col-6 lg:col-6">
      <label class="font-semibold">行動電話</label>
      <input pInputText />
    </div>
    <div class="field col-12 md:col-6 lg:col-6">
      <label class="font-semibold">公司電話</label>
      <input pInputText />
    </div>
    <div class="field col-12 md:col-6 lg:col-6">
      <label class="font-semibold">電子郵件</label>
      <input pInputText />
    </div>
  </div>
  <div class="flex justify-content-end">
    <p-button label="新增" styleClass="p-button-primary mr-2"></p-button>
    <p-button label="取消" styleClass="p-button-outlined p-button-secondary"></p-button>
  </div>
</p-dialog>
