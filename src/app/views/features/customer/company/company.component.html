<div class="overflow-x-hidden flex justify-content-center">
  <div class="col-12">
    <div class="col-12">
      <p-button icon="pi pi-arrow-left" [routerLink]="['/customer']"
                styleClass="p-button-lg p-button-rounded p-button-secondary p-button-text"></p-button>
    </div>
    <form [formGroup]="editCompany_form">
      <div class="flex justify-content-center">
        <div class="col-8">
          <div class="grid row-gap-2 flex justify-content-center">
            <div class="col-3 flex align-items-center">
              <p-image src="assets/image/car3.jpg" alt="Image" width="100" [preview]="true"></p-image>
            </div>
            <div class="col-9 flex align-items-center justify-content-start">
              <label class="text-6xl font-bold">{{editCompany_form.controls['name'].value}}</label>
            </div>
            <div class="col-12">
              <p-tabView>
                <p-tabPanel header="基本資料">
                  <div class="grid">
                    <div class="field col-6">
                      <label class="font-semibold">客戶</label>
                      <input pInputText formControlName="name"/>
                    </div>
                    <div class="field col-6">
                      <label class="font-semibold">地址</label>
                      <input pInputText formControlName="address"/>
                    </div>
                    <div class="col-12 flex justify-content-end">
                      <p-button label="儲存" styleClass="p-button-warning"></p-button>
                    </div>
                  </div>
                </p-tabPanel>
                <p-tabPanel header="倉儲">
                  <div class="flex justify-content-end mb-3">
                    <p-button icon="pi pi-plus" styleClass="p-button-warning p-button-text"></p-button>
                  </div>
                  <p-dataView [value]="warehousesData">
                    <ng-template let-product pTemplate="listItem">
                      <div pRipple class="col-6 styled-box" (click)="goToWarehouse(product.id)">
                        <div class="flex flex-column xl:flex-row xl:align-items-start p-3 gap-4">
                          <img class="w-2 sm:w-9rem xl:w-3rem" [src]="'assets/image/warehouse.png'"/>
                          <div
                            class="flex flex-column sm:flex-row justify-content-between align-items-center xl:align-items-start flex-1 gap-4">
                            <div class="flex flex-column align-items-center sm:align-items-start gap-3">
                              <div class="text-lg font-bold">{{ product.manager }}</div>

                              <div class="flex align-items-center gap-3">
                                <span class="flex align-items-center gap-2">
                                <i class="pi pi-at text-xs"></i>
                                <span class="font-medium text-xs">{{ product.name }}</span>
                                  </span>
                                <span class="flex align-items-center gap-2">
                                <i class="pi pi-tag text-xs"></i>
                                <span class="font-medium text-xs">{{ product.address }}</span>
                                </span>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </ng-template>
                  </p-dataView>
                </p-tabPanel>
                <p-tabPanel header="貨物品項">
                  <div *ngIf="!showDetailPage">
                    <div class="flex justify-content-end mb-3">
                      <p-button (click)="openAddGoods()" icon="pi pi-plus"
                                styleClass="p-button-warning p-button-text"></p-button>
                    </div>
                    <p-dataView [value]="goodsData">
                      <ng-template let-product pTemplate="listItem">
                        <div pRipple class="col-6 styled-box" (click)="showGoodsView(product.id)">
                          <div class="flex flex-column xl:flex-row xl:align-items-start p-3 gap-4">
                            <img class="w-2 sm:w-9rem xl:w-3rem" [src]="'assets/image/warehouse.png'"/>
                            <div
                              class="flex flex-column sm:flex-row justify-content-between align-items-center xl:align-items-start flex-1 gap-4">
                              <div class="flex flex-column align-items-center sm:align-items-start gap-3">
                                <div class="text-lg font-bold">{{ product.name }}</div>

                                <div class="flex align-items-center gap-3">
                                <span class="flex align-items-center gap-2">
                                <i class="pi pi-inbox text-xs"></i>
                                <span class="font-medium text-xs">{{ product.quantity }} {{ product.unit }}</span>
                                  </span>
                                  <span class="flex align-items-center gap-2">
                                <i class="pi pi-tag text-xs"></i>
                                <span class="font-medium text-xs">{{ product.spec }}</span>
                                </span>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </ng-template>
                    </p-dataView>
                  </div>
                  <div *ngIf="showDetailPage">
                    <p-button icon="pi pi-arrow-left" (click)="backWarehouse()"
                              styleClass="mb-2 p-button-lg p-button-rounded p-button-secondary p-button-text"></p-button>
                    <app-goods-view [productId]="selectedProductId"></app-goods-view>
                  </div>
                </p-tabPanel>
              </p-tabView>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>


<p-dialog header="新增貨物品項" [(visible)]="addGoodsVisible" [modal]="true" [style]="{ width: '50vw' }"
          [draggable]="false" [resizable]="false">
  <form [formGroup]="addGoods_form">
    <div class="grid">
      <div class="col-12 md:col-6 lg:col-6">
        <div class="field">
          <label class="font-semibold">名稱</label>
          <input formControlName="name" pInputText/>
        </div>
      </div>
      <div class="col-12 md:col-6 lg:col-6">
        <div class="field">
          <label class="font-semibold">規格</label>
          <input formControlName="spec" pInputText/>
        </div>
      </div>
      <div class="col-12 md:col-6 lg:col-6">
        <div class="field">
          <label class="font-semibold">數量</label>
          <p-inputNumber class="w-full" formControlName="quantity" [min]="0"></p-inputNumber>
        </div>
      </div>
      <div class="col-12 md:col-6 lg:col-6">
        <div class="field">
          <label class="font-semibold">單位</label>
          <input formControlName="unit" pInputText/>
        </div>
      </div>
      <div class="col-12 md:col-6 lg:col-6">
        <div class="field">
          <label class="font-semibold">單價</label>
          <p-inputNumber class="w-full" formControlName="price" mode="currency" inputId="currency-taiwan" currency="TWD"
                         locale="zh-TW" [min]="0"></p-inputNumber>
        </div>
      </div>
      <div class="col-12 md:col-6 lg:col-6">
        <div class="field">
          <label class="font-semibold">總額</label>
          <p-inputNumber class="w-full" formControlName="total" mode="currency" inputId="currency-taiwan" currency="TWD"
                         locale="zh-TW" [min]="0"></p-inputNumber>
        </div>
      </div>
      <div class="col-12 flex justify-content-end">
        <p-button label="取消" styleClass="mr-2 p-button-outlined p-button-secondary"></p-button>
        <p-button label="新增" styleClass="p-button-warning"></p-button>
      </div>
    </div>
  </form>
</p-dialog>
