<div class="overflow-x-hidden flex justify-content-center">
  <div class="col-12">
    <p-card>
      <p-tabView>
        <p-tabPanel header="異常設定">
          <div class=" flex justify-content-center">
          <div class="col-5">
            <p-dataView [value]="odd">
              <ng-template let-product pTemplate="listItem" let-expanded="expanded">
                <div class="col-12">
                  <div class="flex flex-column xl:flex-row xl:align-items-start p-4 gap-4">
                    <div class="relative">
                    <p-button class="toggle-button" styleClass="p-button-text" (click)="toggleAdditionalContent(product)">
                      <i *ngIf="!product.showAdditionalContent" class="pi pi-chevron-right"></i>
                      <i *ngIf="product.showAdditionalContent" class="pi pi-chevron-down"></i>
                    </p-button>
                    <img class="w-4 sm:w-8em xl:w-6rem shadow-2 block xl:block mx-auto border-round"
                         [src]="product.image" [alt]="product.type"/>
                      <div class="additional-content" *ngIf="product.showAdditionalContent">
                        <p-table>
                          <ng-template pTemplate="header">
                            <tr>
                              <th>視窗</th>
                              <th>鈴聲</th>
                              <th>視聽</th>
                            </tr>
                          </ng-template>
                          <ng-template pTemplate="body">
                            <tr>
                              <td>
                                <p-toggleButton onIcon="pi pi-check" offIcon="pi pi-times"></p-toggleButton>
                              </td>
                              <td>
                                <p-toggleButton onIcon="pi pi-check" offIcon="pi pi-times"></p-toggleButton>
                              </td>
                              <td>
                                <p-button icon="pi pi-volume-up" styleClass="p-button-warning"></p-button>
                              </td>
                            </tr>
                          </ng-template>
                        </p-table>
                      </div>
                    </div>
                    <div class="flex flex-column sm:flex-row justify-content-between align-items-center xl:align-items-start flex-1 gap-4">
                      <div class="flex flex-column align-items-center sm:align-items-start gap-3">
                      <div class="text-2xl font-bold text-900">{{ product.type }}</div>
                      <div class="grid field ml-1">
                        <p-inputNumber class="w-5"></p-inputNumber>
                        <label class="col-fixed">分鐘</label>
                      </div>
                    </div>
                      <p-toggleButton onIcon="pi pi-check" offIcon="pi pi-times" class="mt-6"></p-toggleButton>
                    </div>
                  </div>
                </div>
              </ng-template>
            </p-dataView>
          </div>
          </div>
        </p-tabPanel>

        <p-tabPanel header="速限設定">

        </p-tabPanel>
      </p-tabView>
    </p-card>
  </div>
</div>
