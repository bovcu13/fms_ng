<div class="overflow-x-hidden">
  <div class="grid">
    <div class="col-12 h-screen">
      <p-splitter [panelSizes]="[70, 30]" [style]="{ height: '100%' }">
        <ng-template pTemplate>
          <google-map class="w-full" height="100%" width="100%" [center]="center" [zoom]="zoom" [options]="options"
                      (mapClick)="moveMap($event)"  (mapMousemove)="move($event)">
            <map-marker
              #markerElem="mapMarker"
              *ngFor="let marker of markers"
              [position]="marker.position"
              [title]="marker.title"
              [icon]="marker.icon"
              (mapClick)="openInfo(markerElem, marker.label.text)">
            </map-marker>

            <map-info-window>{{ infoContent }}</map-info-window>
            <map-polyline [options]="polyOptions" [path]="polyPath"></map-polyline>
          </google-map>
        </ng-template>
        <ng-template pTemplate>
          <p-card class="w-full">
            <p-tabView>
              <p-tabPanel header="車隊查詢">
                <div class="grid">
                  <div class="col-6">
                    <p-dropdown [options]="carGroups" optionLabel="name" placeholder="選擇車隊"></p-dropdown>
                  </div>
                  <div class="col-6">
                    <p-dropdown [options]="cars" optionLabel="name" placeholder="選擇車牌"></p-dropdown>
                  </div>
                  <div class="col-6">
                    <p-calendar [showTime]="true" placeholder="選擇開始時間"></p-calendar>
                  </div>
                  <div class="col-6">
                    <p-calendar [showTime]="true" placeholder="選擇結束時間"></p-calendar>
                  </div>
                </div>
                <p-table [value]="products" [paginator]="true" [rows]="5" selectionMode="single" [(selection)]="selectedProduct"
                         [tableStyle]="{ 'min-width': '33rem'}" (onRowSelect)="Select()">
                  <ng-template pTemplate="header">
                    <tr>
                      <th>狀態累積</th>
                      <th>狀態</th>
                      <th>速度</th>
                      <th>地址</th>
                    </tr>
                  </ng-template>
                  <ng-template pTemplate="body" let-product>
                    <tr [pSelectableRow]="product">
                      <td>{{ product.statetime }}</td>
                      <td>{{ product.state }}</td>
                      <td>{{ product.speed }}</td>
                      <td>{{ product.addr }}</td>
                    </tr>
                  </ng-template>
                </p-table>
                <p-accordion [activeIndex]="0">
                  <p-accordionTab header="異常中心">
                    <p-card styleClass="flex justify-content-center">
                      <h2 class="text-center">溫度異常</h2>
                      <p-divider></p-divider>
                      <h2 class="text-center">0</h2><br>
                      <h2 class="text-center">台</h2>
                    </p-card>
                  </p-accordionTab>
                </p-accordion>
              </p-tabPanel>
              <p-tabPanel header="功能A">

              </p-tabPanel>
              <p-tabPanel header="功能B">

              </p-tabPanel>
            </p-tabView>
          </p-card>
        </ng-template>
      </p-splitter>
    </div>
  </div>
</div>
