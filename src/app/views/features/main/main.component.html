<div class="overflow-x-hidden">
  <div class="grid">
    <div class="col-2">
      <p-sidebar styleClass="w-2" [visible]="true" [modal]="false" [showCloseIcon]="false" transitionOptions="0ms">
        <h3>iCar TMS 1.0</h3>
        <p-panelMenu [model]="items"></p-panelMenu>
      </p-sidebar>
    </div>
    <div class="col-10 h-screen">
      <p-splitter [panelSizes]="[70, 30]" [style]="{ height: '100%' }">
        <ng-template pTemplate>
          <iframe class="iframe-bottom-layer"
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3615.002889711431!2d121.56453889999999!3d25.033976!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442abb6da9c9e1f%3A0x1206bcf082fd10a6!2zMTEw5Y-w5YyX5biC5L-h576p5Y2A5L-h576p6Lev5LqU5q61N-iZnw!5e0!3m2!1szh-CN!2stw!4v1669280313154!5m2!1szh-TW!2stw"
                  width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
        </ng-template>
        <ng-template pTemplate>
          <p-card class="w-full">
            <p-tabView>
              <p-tabPanel header="車隊查詢">
                <div class="grid">
                  <div class="col-6">
                    <p-dropdown [options]="carGroups" optionLabel="name" placeholder="選擇車隊"></p-dropdown>
                  </div>
                  <div class="col-6">
                    <p-dropdown [options]="cars" optionLabel="name" placeholder="選擇車牌"></p-dropdown>
                  </div>
                  <div class="col-12">
                    <p-calendar selectionMode="range" dateFormat="yy-mm-dd"
                                [readonlyInput]="true" placeholder="選擇起訖日期"></p-calendar>
                  </div>
                </div>
                <p-table [value]="products" [tableStyle]="{ 'min-width': '25rem' }">
                  <ng-template pTemplate="header">
                    <tr>
                      <th>狀態累積</th>
                      <th>狀態</th>
                      <th>速度</th>
                      <th>地址</th>
                    </tr>
                  </ng-template>
                  <ng-template pTemplate="body" let-product>
                    <tr>
                      <td>{{ product.statetime }}</td>
                      <td>{{ product.state }}</td>
                      <td>{{ product.speed }}</td>
                      <td>{{ product.addr }}</td>
                    </tr>
                  </ng-template>
                </p-table>
              </p-tabPanel>
              <p-tabPanel header="功能A">

              </p-tabPanel>
              <p-tabPanel header="功能B">

              </p-tabPanel>
            </p-tabView>
          </p-card>
        </ng-template>
      </p-splitter>
    </div>
  </div>
</div>
