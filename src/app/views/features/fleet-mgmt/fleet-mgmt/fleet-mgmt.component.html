                                <i class="pi pi-at text-xs"></i>

                                  </span>
                            <span class="flex align-items-center gap-2">
                                <i class="pi pi-tag text-xs"></i>
                                <span class="font-medium text-xs">{{ product.license_plate }}</span>
                                </span>
                          </div>
                        </div>
                        <!--                        <div class="flex sm:flex-column align-items-center sm:align-items-end gap-3 sm:gap-2">-->
                        <!--                          <p-button (click)="goToVehicle(product.id)" label="管理"-->
                        <!--                                    styleClass="p-button-link"></p-button>-->
                        <!--                        </div>-->
                      </div>
                    </div>
                  </div>
                </ng-template>
              </p-dataView>

<!--新增車輛-->
<p-dialog header="新增車輛" [(visible)]="addDialogVisible" [modal]="true" [style]="{ width: '25vw' }"
          [draggable]="false" [resizable]="false">
  <form [formGroup]="addVehicle_form">
    <div class="col-12">
      <div class="field">
        <label class="font-semibold">車輛名稱</label>
        <input formControlName="name" pInputText/>
      </div>
      <div class="field">
        <label class="font-semibold">司機名稱</label>
        <input formControlName="driver" pInputText/>
      </div>
      <div class="field">
        <label class="font-semibold">車牌號碼</label>
        <input formControlName="license_plate" pInputText/>
      </div>
      <div class="field">
        <label class="font-semibold">車機號碼</label>
        <input formControlName="sid" pInputText/>
      </div>
      <div class="flex justify-content-end">
        <p-button (click)="postVehicleRequest()" label="新增" styleClass="p-button-primary mr-2"></p-button>
        <p-button label="取消"
                  styleClass="p-button-outlined p-button-secondary"></p-button>
      </div>
    </div>
  </form>
</p-dialog>
