<form [formGroup]="editGoods_form">
  <div class="grid">
    <div class="col-12 flex align-items-center justify-content-between">
      <div>
        <label class="text-2xl font-bold">{{editGoods_form.controls['name'].value}}</label>
      </div>
      <div>
        <p-button label="儲存" styleClass="p-button-sm p-button-warning"></p-button>
      </div>
    </div>
    <div class="col-6 md:col-6 lg:col-8">
      <p-card>
        <div class="grid">
          <div class="col-12 md:col-6 lg:col-6">
            <div class="field">
              <label class="font-semibold text-sm">名稱</label>
              <input formControlName="name" pInputText/>
            </div>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <div class="field">
              <label class="font-semibold text-sm">規格</label>
              <input formControlName="spec" pInputText/>
            </div>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <div class="field">
              <label class="font-semibold text-sm">數量</label>
              <input formControlName="quantity" pInputText/>
            </div>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <div class="field">
              <label class="font-semibold text-sm">單位</label>
              <input formControlName="unit" pInputText/>
            </div>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <div class="field">
              <label class="font-semibold text-sm">單價</label>
              <input formControlName="price" pInputText/>
            </div>
          </div>
          <div class="col-12 md:col-6 lg:col-6">
            <div class="field">
              <label class="font-semibold text-sm">總額</label>
              <input formControlName="total" pInputText/>
            </div>
          </div>
        </div>
      </p-card>
    </div>
    <div class="col-6 md:col-6 lg:col-4">
      <p-card>
        <div class="card">
          <p-galleria [value]="images" [responsiveOptions]="responsiveOptions" [numVisible]="2">
            <ng-template pTemplate="item" let-item>
              <img [src]="item.itemImageSrc" style="width: 100%;" />
            </ng-template>
            <ng-template pTemplate="thumbnail" let-item>
              <div class="grid grid-nogutter justify-content-center">
                <img [src]="item.thumbnailImageSrc" style="width: 100%;"/>
              </div>
            </ng-template>
          </p-galleria>
        </div>
      </p-card>
    </div>
  </div>
</form>
