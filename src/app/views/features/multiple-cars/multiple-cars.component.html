<div class="col-12">
  <div class="flex justify-content-end">
    <p-toggleButton onIcon="pi pi-chevron-left" offIcon="pi pi-chevron-right"
                    [ngModel]="false" (ngModelChange)="toggleSidebar()"></p-toggleButton>
  </div>
  <div class="grid">
    <div class="mt-2" [ngClass]="getMiddleDivClass()">
      <div class="grid">
        <ng-container *ngFor="let selected of selectedProduct">
          <google-map class="border-3" [ngClass]="showLayout()" height="100%" width="100%"
                      [center]="selected.position" [zoom]="zoom" [options]="options">
            <map-marker #markerElem="mapMarker"
                        *ngFor="let marker of markers"
                        [position]="marker.position"
                        [title]="marker.title"
                        [icon]="marker.icon" (mapClick)="openInfo(markerElem,marker.label?.text)">
            </map-marker>
            <map-info-window>{{infoContent}}</map-info-window>
          </google-map>
        </ng-container>
      </div>
    </div>
    <div class="col-12 md:col-12 lg:col-4" *ngIf="sidebarRightOpen">
      <p-tabView>
        <p-tabPanel>
          <ng-template pTemplate="header">
            <span>車隊查詢</span>
          </ng-template>
          <p-toast></p-toast>
          <p-table [value]="products" [rows]="5" selectionMode="multiple" [scrollable]="true" scrollHeight="90vh"
                   [(selection)]="selectedProduct" (selectionChange)="onSelectionChange($event)">
            <ng-template pTemplate="header">
              <tr>
                <th style="width: 4rem">
                  <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                </th>
                <th>狀態累積</th>
                <th>狀態</th>
                <th>速度</th>
                <th>地址</th>
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-product>
              <tr>
                <td>
                  <p-tableCheckbox [value]="product"></p-tableCheckbox>
                </td>
                <td [pSelectableRow]="product">{{ product.statetime }}</td>
                <td [pSelectableRow]="product">{{ product.state }}</td>
                <td [pSelectableRow]="product">{{ product.speed }}</td>
                <td [pSelectableRow]="product">{{ product.addr }}</td>
              </tr>
            </ng-template>
          </p-table>
        </p-tabPanel>
      </p-tabView>
    </div>
  </div>
</div>
