<div class="overflow-x-hidden">
  <div class="grid">
    <div class="col-12 h-screen">
      <p-splitter [panelSizes]="[70, 30]" [style]="{ height: '95vh'}">
        <ng-template pTemplate>
          <google-map class="w-full" height="100%" width="100%"
                      [center]="center" [zoom]="zoom" [options]="options"
                      (mapClick)="moveMap($event)" (mapMousemove)="move($event)">
            <map-marker
              #markerElem="mapMarker"
              *ngFor="let marker of markers"
              [position]="marker.position"
              [title]="marker.title"
              [icon]="marker.icon"
              (mapClick)="openInfo(markerElem, marker.label.text)">
            </map-marker>
<!--              <map-traffic-layer [autoRefresh]="true"></map-traffic-layer>-->
            <map-info-window>{{ infoContent }}</map-info-window>
            <map-polyline [path]="polyPath"></map-polyline>
          </google-map>
          <hr style="border: 2px solid;">
          <google-map class="w-full" height="100%" width="100%"
                      [center]="center" [zoom]="zoom" [options]="options"
                      (mapClick)="moveMap($event)" (mapMousemove)="move($event)">
            <map-marker
              #markerElem="mapMarker"
              *ngFor="let marker of markers"
              [position]="marker.position"
              [title]="marker.title"
              [icon]="marker.icon"
              (mapClick)="openInfo(markerElem, marker.label.text)">
            </map-marker>
            <!--              <map-traffic-layer [autoRefresh]="true"></map-traffic-layer>-->
            <map-info-window>{{ infoContent }}</map-info-window>
            <map-polyline [path]="polyPath"></map-polyline>
          </google-map>
        </ng-template>
        <ng-template pTemplate>
          <p-card class="w-full mr-2 ml-2 mb-2">
            <p-tabView>
              <p-tabPanel>
                <ng-template pTemplate="header">
                  <span>車隊查詢</span>
                </ng-template>
                <p-table [value]="products" [rows]="5" selectionMode="multiple"
                         [(selection)]="selectedProduct">
                  <ng-template pTemplate="header">
                    <tr>
                      <th style="width: 4rem">
                        <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                      </th>
                      <th>狀態累積</th>
                      <th>狀態</th>
                      <th>速度</th>
                      <th>地址</th>
                    </tr>
                  </ng-template>
                  <ng-template pTemplate="body" let-product>
                    <tr>
                      <td>
                        <p-tableCheckbox [value]="product"></p-tableCheckbox>
                      </td>
                      <td [pSelectableRow]="product">{{ product.statetime }}</td>
                      <td [pSelectableRow]="product">{{ product.state }}</td>
                      <td [pSelectableRow]="product">{{ product.speed }}</td>
                      <td [pSelectableRow]="product">{{ product.addr }}</td>
                    </tr>
                  </ng-template>
                </p-table>
              </p-tabPanel>
            </p-tabView>
          </p-card>
        </ng-template>
      </p-splitter>
    </div>
  </div>
</div>
