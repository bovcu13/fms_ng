<div class="overlay" *ngIf="visible">
  <i class="pi pi-spin pi-spinner text-white" style="font-size: 2.5rem"></i>
</div>
<div class="col-12">
  <div class="grid">
    <div [ngClass]="getMiddleDivClass()">
      <p-card>
        <p-tabView (onChange)="check($event)" (onClose)="close($event)" [selectOnFocus]="true">
          <p-tabPanel *ngFor="let search of Panels; let i = index" [closable]="closable()">
            <ng-template pTemplate="header">
              <span>查詢{{search}}</span>
            </ng-template>
            <div class="grid">
              <ng-container *ngFor="let selected of selectedProduct">
                <google-map class="border-3" [ngClass]="showLayout()" height="100%" width="100%"
                            [center]="selected.position" [zoom]="zoom" [options]="options">
                  <map-marker #markerElem="mapMarker"
                              *ngFor="let marker of markers"
                              [position]="marker.position"
                              [icon]="marker.icon" (mapClick)="openInfo(markerElem,marker.infoWindowContent)">
                  </map-marker>
                  <map-info-window>{{infoContent}}</map-info-window>
                  <ng-container *ngIf="trafficVisable">
                    <map-traffic-layer [autoRefresh]="true"></map-traffic-layer>
                  </ng-container>
                </google-map>
              </ng-container>
            </div>
          </p-tabPanel>
          <p-tabPanel>
            <ng-template pTemplate="header">
              <label>+</label>
            </ng-template>
          </p-tabPanel>
        </p-tabView>
      </p-card>
    </div>
    <div class="col-12 md:col-12 lg:col-4" *ngIf="sidebarRightOpen">
      <p-card>
        <p-tabView>
          <p-tabPanel>
            <ng-template pTemplate="header">
              <span>車隊查詢</span>
            </ng-template>
            <p-toast></p-toast>
            <p-table #dt1
                     [value]="products"
                     [rows]="5"
                     selectionMode="multiple"
                     [scrollable]="true"
                     scrollHeight="90vh"
                     [(selection)]="selectedProduct"
                     (selectionChange)="onSelectionChange($event)"
                     [globalFilterFields]="['status', 'license_plate', 'driver', 'address']"
                     styleClass="text-sm p-datatable-sm p-datatable-striped">
              <ng-template pTemplate="caption">
                <div class="flex justify-content-start">
                  <span class="p-input-icon-left mr-auto">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" (input)="filterGlobal($event)" placeholder="搜尋 .."/>
                  </span>
                  <div class="ml-auto">
                    <p-toggleButton pTooltip="顯示路況" styleClass="border-circle" [(ngModel)]="trafficVisable"
                                    onIcon="pi pi-truck" offIcon="pi pi-truck"></p-toggleButton>
                  </div>
                </div>
              </ng-template>
              <ng-template pTemplate="header">
                <tr>
                  <th>
                    <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                  </th>
                  <th>狀態</th>
                  <th>車牌</th>
                  <th>司機</th>
                  <th>地址</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-product>
                <tr>
                  <td>
                    <p-tableCheckbox [value]="product"></p-tableCheckbox>
                  </td>
                  <td [pSelectableRow]="product">{{ product.status }}</td>
                  <td [pSelectableRow]="product">{{ product.license_plate }}</td>
                  <td [pSelectableRow]="product">{{ product.driver }}</td>
                  <td [pSelectableRow]="product">{{ product.address }}</td>
                </tr>
              </ng-template>
            </p-table>
          </p-tabPanel>
        </p-tabView>
      </p-card>
    </div>
  </div>
</div>
