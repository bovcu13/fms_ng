<p-toast></p-toast>
<div class="overflow-x-hidden flex justify-content-center">
    <div class="col-8">
        <p-card header="板車">
            <p-tabView>
                <p-tabPanel header="所有板車">
                    <div class="flex justify-content-end mb-3">
                        <p-button (click)="openAddTrailersDialog()"
                                  icon="pi pi-plus" severity="warning" [text]="true"></p-button>
                    </div>
                    <p-dataView [value]="trailersData">
                        <ng-template let-product pTemplate="listItem">
                            <div pRipple class="col-6 styled-box" (click)="goToTrailers(product.id)">
                                <div class="flex flex-column align-items-center xl:flex-row xl:align-items-start p-3 gap-4">
                                    <img class="w-8 sm:w-5rem xl:w-3rem" [src]="'assets/image/circle.png'"/>
                                    <div
                                            class="flex sm:flex-row justify-content-between align-items-center xl:align-items-start flex-1 gap-4">
                                        <div class="flex flex-column align-items-center xl:align-items-start gap-3">
                                            <div class="font-bold xl:text-lg font-bold">{{ product.code }}</div>
                                            <div class="flex align-items-center gap-3">
                                <span class="flex align-items-center gap-2">
                                <i class="pi pi-at text-xs"></i>
                                <span class="font-medium text-xs">name?</span>
                                  </span>
                                                <span class="flex align-items-center gap-2">
                                <i class="pi pi-tag text-xs"></i>
                                <span class="font-medium text-xs">type?</span>
                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </ng-template>
                    </p-dataView>
                </p-tabPanel>
            </p-tabView>
        </p-card>
    </div>
</div>

<!--新增板車-->
<p-dialog header="新增板車" [(visible)]="addTrailersDialogVisible" [modal]="true" [style]="{ width: '40vw' }"
          [draggable]="false" [resizable]="false">
    <form [formGroup]="addTrailers_form">
        <div class="col-12">
            <div class="field">
                <label class="font-semibold">板車號碼</label>
                <input formControlName="code" pInputText/>
            </div>
            <div class="flex justify-content-end">
                <p-button label="取消" (click)="closeAddTrailersDialog()" [outlined]="true" severity="secondary"
                          styleClass="mr-2"></p-button>
                <p-button (click)="postTrailersRequest()" label="新增" severity="warning"></p-button>
            </div>
        </div>
    </form>
</p-dialog>
